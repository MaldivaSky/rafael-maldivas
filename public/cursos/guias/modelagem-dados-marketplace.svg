<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bgEr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bgEr)"/>

  <!-- Header -->
  <rect x="40" y="24" width="1120" height="74" rx="14" fill="#0b1528" stroke="#34d399" stroke-width="1.5"/>
  <text x="65" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.4">
    ALICERCE DO SISTEMA · COMO MODELAR DADOS DE UM MARKETPLACE REAL
  </text>
  <text x="65" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="21" font-weight="800">
    Modelagem Relacional Multi-Lojista: Por que separamos Order, SubOrder e OrderItem (Snapshot)?
  </text>

  <!-- TABLE 1: STORE -->
  <g transform="translate(50, 130)">
    <rect width="310" height="210" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="310" height="44" rx="12" fill="#0c4a6e"/>
    <text x="20" y="28" fill="#ffffff" font-family="monospace" font-size="15" font-weight="800">
      1. TABELA: stores_store
    </text>
    <text x="20" y="70" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="700">🔑 id (PK · UUID / Int)</text>
    <text x="20" y="96" fill="#e2e8f0" font-family="monospace" font-size="13">name: &quot;Urbano Streetwear&quot;</text>
    <text x="20" y="122" fill="#e2e8f0" font-family="monospace" font-size="13">slug: &quot;urbano-streetwear&quot;</text>
    <text x="20" y="148" fill="#fde68a" font-family="monospace" font-size="13" font-weight="700">commission_bps: 1200 (12%)</text>
    <text x="20" y="174" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Guarda cada vendedor parceiro e sua taxa de comissão combinada.
    </text>
  </g>

  <!-- TABLE 2: PRODUCT -->
  <g transform="translate(50, 410)">
    <rect width="310" height="250" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect width="310" height="44" rx="12" fill="#0c4a6e"/>
    <text x="20" y="28" fill="#ffffff" font-family="monospace" font-size="15" font-weight="800">
      2. TABELA: catalog_product
    </text>
    <text x="20" y="70" fill="#7dd3fc" font-family="monospace" font-size="13" font-weight="700">🔑 id (PK)</text>
    <text x="20" y="96" fill="#38bdf8" font-family="monospace" font-size="13">🔗 store_id (FK → stores_store)</text>
    <text x="20" y="122" fill="#e2e8f0" font-family="monospace" font-size="13">sku: &quot;CAM-OVER-PRETA-G&quot;</text>
    <text x="20" y="148" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">price_cents: 12990 (R$ 129,90)</text>
    <text x="20" y="174" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="700">stock_qty: 5 (Trava &gt;= qty)</text>
    <rect x="16" y="192" width="278" height="44" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="26" y="212" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
      ⚠️ ATENÇÃO: Este preço muda na Black Friday!
    </text>
    <text x="26" y="228" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11">
      Por isso o recibo NUNCA lê o preço daqui depois!
    </text>
  </g>

  <!-- TABLE 3: ORDER (PAI) -->
  <g transform="translate(445, 130)">
    <rect width="310" height="220" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <rect width="310" height="44" rx="12" fill="#064e3b"/>
    <text x="20" y="28" fill="#ffffff" font-family="monospace" font-size="15" font-weight="800">
      3. TABELA: orders_order (Pai)
    </text>
    <text x="20" y="70" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700">🔑 id (PK · Pedido do Cliente)</text>
    <text x="20" y="96" fill="#e2e8f0" font-family="monospace" font-size="13">buyer_email: &quot;ana@cliente.com&quot;</text>
    <text x="20" y="122" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">total_cents: 34980 (R$ 349,80)</text>
    <text x="20" y="148" fill="#fde68a" font-family="monospace" font-size="13">status: PENDING → PAID</text>
    <text x="20" y="174" fill="#cbd5e1" font-family="monospace" font-size="12">shipping_address_snapshot (JSON)</text>
    <text x="20" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Representa o pagamento único do cliente no checkout.
    </text>
  </g>

  <!-- TABLE 4: SUB_ORDER (FILHO POR LOJA) -->
  <g transform="translate(445, 410)">
    <rect width="310" height="250" rx="12" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <rect width="310" height="44" rx="12" fill="#064e3b"/>
    <text x="20" y="28" fill="#ffffff" font-family="monospace" font-size="15" font-weight="800">
      4. TABELA: orders_suborder
    </text>
    <text x="20" y="70" fill="#6ee7b7" font-family="monospace" font-size="13" font-weight="700">🔑 id (PK · Pacote de 1 Loja)</text>
    <text x="20" y="96" fill="#34d399" font-family="monospace" font-size="13">🔗 order_id (FK → orders_order)</text>
    <text x="20" y="122" fill="#38bdf8" font-family="monospace" font-size="13">🔗 store_id (FK → stores_store)</text>
    <text x="20" y="148" fill="#e2e8f0" font-family="monospace" font-size="13">subtotal_cents: 12990</text>
    <text x="20" y="174" fill="#fde68a" font-family="monospace" font-size="13" font-weight="700">platform_fee_cents: 1559</text>
    <text x="20" y="200" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">seller_net_cents: 11431</text>
    <text x="20" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Permite que Loja A envie hoje e Loja B envie amanhã!
    </text>
  </g>

  <!-- TABLE 5: ORDER_ITEM (SNAPSHOT IMUTÁVEL) -->
  <g transform="translate(835, 250)">
    <rect width="325" height="310" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5"/>
    <rect width="325" height="48" rx="12" fill="#78350f"/>
    <text x="20" y="30" fill="#fef08a" font-family="monospace" font-size="15" font-weight="800">
      5. TABELA: orders_orderitem
    </text>
    <text x="20" y="74" fill="#fde68a" font-family="monospace" font-size="13" font-weight="700">🔑 id (PK · Linha do Recibo)</text>
    <text x="20" y="102" fill="#34d399" font-family="monospace" font-size="13">🔗 sub_order_id (FK → suborder)</text>
    <text x="20" y="130" fill="#f87171" font-family="monospace" font-size="13" font-weight="700">🛡️ product_id (FK · PROTECT)</text>
    <text x="20" y="158" fill="#e2e8f0" font-family="monospace" font-size="13">product_title_snapshot: &quot;Camiseta&quot;</text>
    <text x="20" y="186" fill="#fef08a" font-family="monospace" font-size="13" font-weight="800">📸 unit_price_cents: 12990</text>
    <text x="20" y="214" fill="#e2e8f0" font-family="monospace" font-size="13">quantity: 1</text>
    <rect x="16" y="232" width="293" height="62" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
    <text x="26" y="254" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
      ✓ REGRAS DE OURO DA MODELAGEM:
    </text>
    <text x="26" y="272" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11">
      1. Snapshot copia o preço no ato da compra.
    </text>
    <text x="26" y="287" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="11">
      2. PROTECT proíbe deletar produto já vendido!
    </text>
  </g>

  <!-- Relationship Connectors (1:N Arrows) -->
  <!-- Store 1:N Product -->
  <line x1="205" y1="340" x2="205" y2="410" stroke="#38bdf8" stroke-width="3"/>
  <text x="215" y="380" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="700">1 Loja → N Produtos</text>

  <!-- Order 1:N SubOrder -->
  <line x1="600" y1="350" x2="600" y2="410" stroke="#34d399" stroke-width="3"/>
  <text x="610" y="385" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700">1 Pedido → N Pacotes</text>

  <!-- Store 1:N SubOrder -->
  <line x1="360" y1="240" x2="445" y2="480" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- SubOrder 1:N OrderItem -->
  <line x1="755" y1="510" x2="835" y2="420" stroke="#f59e0b" stroke-width="3"/>
  <text x="760" y="450" fill="#fde68a" font-family="monospace" font-size="11" font-weight="700">1:N Itens</text>

  <!-- Product PROTECT OrderItem -->
  <line x1="360" y1="540" x2="835" y2="510" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="530" y="692" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="700">
    🛡️ on_delete=models.PROTECT (Impede apagar produto que possui histórico financeiro em OrderItem)
  </text>
</svg>
