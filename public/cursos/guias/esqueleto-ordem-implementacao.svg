<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070d19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad)"/>

  <!-- Blueprint Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.55">
    <line x1="0" y1="110" x2="1200" y2="110"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="440" x2="1200" y2="440"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="200" y1="0" x2="200" y2="760"/>
    <line x1="600" y1="0" x2="600" y2="760"/>
    <line x1="1000" y1="0" x2="1000" y2="760"/>
  </g>

  <!-- Header -->
  <rect x="40" y="24" width="1120" height="72" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="65" y="54" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">
    ENGENHARIA DE SOFTWARE PASSO A PASSO · DO ALICERCE AO TELHADO
  </text>
  <text x="65" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">
    O Esqueleto de Todo Sistema &amp; A Ordem Oficial de Implementação (De Baixo para Cima)
  </text>

  <!-- Right Side Escalator Arrow Indicator -->
  <rect x="1030" y="116" width="130" height="610" rx="14" fill="#0b1528" stroke="#334155" stroke-width="1.5"/>
  <text x="1095" y="150" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="800">
    ORDEM REAL
  </text>
  <text x="1095" y="170" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Comece no 1 (Base)
  </text>
  <line x1="1095" y1="670" x2="1095" y2="200" stroke="#34d399" stroke-width="4" stroke-dasharray="8 6"/>
  <polygon points="1095,185 1083,210 1107,210" fill="#34d399"/>
  <text x="1095" y="700" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">
    1º ALICERCE
  </text>

  <!-- DEGRAU 6 (Top - Roof / Vitrine + Testes + Deploy) -->
  <g transform="translate(40, 116)">
    <rect width="970" height="90" rx="12" fill="url(#emeraldGlow)" stroke="#34d399" stroke-width="2"/>
    <rect x="16" y="16" width="135" height="58" rx="8" fill="#064e3b"/>
    <text x="83" y="42" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800">DEGRAU 6 (TOPO)</text>
    <text x="83" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Vitrine &amp; Testes</text>
    <text x="170" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">
      6. Acabamento Visual (Front-end), Testes Automatizados &amp; Deploy R$ 0
    </text>
    <text x="170" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">
      A vitrine HTML/Next.js consome a API pronta. O script testar_minha_casa.py confere tudo antes de subir na Vercel/Render.
    </text>
    <text x="170" y="77" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700">
      Arquivos: 01-acabamento-vitrine/index.html + testar_minha_casa.py + 04-telhado-deploy/
    </text>
  </g>

  <!-- DEGRAU 5 (Portas HTTP & Webhooks) -->
  <g transform="translate(40, 220)">
    <rect width="970" height="90" rx="12" fill="url(#cyanGlow)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="16" y="16" width="135" height="58" rx="8" fill="#0c4a6e"/>
    <text x="83" y="42" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">DEGRAU 5</text>
    <text x="83" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Rotas &amp; Views</text>
    <text x="170" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">
      5. Portas de Entrada HTTP (Endpoints REST, Views &amp; Webhook PIX)
    </text>
    <text x="170" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">
      O Garçom (URLs) recebe GET /api/products/ ou POST /api/orders/ e entrega para a View responder 200, 201, 401 ou 409.
    </text>
    <text x="170" y="77" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="700">
      Arquivos: orders/urls.py + orders/views.py + webhooks/pix.py (HMAC + Idempotência)
    </text>
  </g>

  <!-- DEGRAU 4 (Motor de Negócio / Services Atômicos) -->
  <g transform="translate(40, 324)">
    <rect width="970" height="90" rx="12" fill="url(#amberGlow)" stroke="#fbbf24" stroke-width="1.8"/>
    <rect x="16" y="16" width="135" height="58" rx="8" fill="#78350f"/>
    <text x="83" y="42" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">DEGRAU 4</text>
    <text x="83" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Motor / Service</text>
    <text x="170" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">
      4. Regras de Negócio &amp; Transação Atômica (Estoque Concorrente &amp; Split)
    </text>
    <text x="170" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">
      O coração blindado: transaction.atomic(), trava de estoque (stock &gt;= qty), congelamento de preço (Snapshot) e divisão de comissão.
    </text>
    <text x="170" y="77" fill="#fde68a" font-family="monospace" font-size="12" font-weight="700">
      Arquivos: 03-paredes-api/api_esqueleto.py · orders/services/create_order.py
    </text>
  </g>

  <!-- DEGRAU 3 (Porteiro / Serializer) -->
  <g transform="translate(40, 428)">
    <rect width="970" height="90" rx="12" fill="url(#cyanGlow)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="16" y="16" width="135" height="58" rx="8" fill="#0c4a6e"/>
    <text x="83" y="42" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="800">DEGRAU 3</text>
    <text x="83" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Serializer</text>
    <text x="170" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">
      3. O Porteiro Conferente (Serializers &amp; Validação de Entrada)
    </text>
    <text x="170" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">
      Traduz objetos do banco para JSON e barra dados maliciosos (quantidade negativa, preço inventado pelo navegador).
    </text>
    <text x="170" y="77" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="700">
      Arquivos: products/serializers.py · orders/serializers.py
    </text>
  </g>

  <!-- DEGRAU 2 (Migrações SQL) -->
  <g transform="translate(40, 532)">
    <rect width="970" height="90" rx="12" fill="url(#emeraldGlow)" stroke="#34d399" stroke-width="1.8"/>
    <rect x="16" y="16" width="135" height="58" rx="8" fill="#064e3b"/>
    <text x="83" y="42" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="800">DEGRAU 2</text>
    <text x="83" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Migrações SQL</text>
    <text x="170" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="17" font-weight="800">
      2. Concretagem do Banco (makemigrations + migrate + Índices)
    </text>
    <text x="170" y="58" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">
      Transforma suas classes Python em tabelas físicas no SQLite/PostgreSQL com chaves primárias (PK) e estrangeiras (FK).
    </text>
    <text x="170" y="77" fill="#6ee7b7" font-family="monospace" font-size="12" font-weight="700">
      Comandos: python manage.py makemigrations → python manage.py migrate
    </text>
  </g>

  <!-- DEGRAU 1 (Base - Modelagem de Dados) -->
  <g transform="translate(40, 636)">
    <rect width="970" height="96" rx="12" fill="url(#amberGlow)" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="16" y="18" width="135" height="60" rx="8" fill="#92400e"/>
    <text x="83" y="43" text-anchor="middle" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="800">DEGRAU 1 (BASE)</text>
    <text x="83" y="63" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Modelagem</text>
    <text x="170" y="36" fill="#fef08a" font-family="system-ui, sans-serif" font-size="18" font-weight="800">
      1. O Alicerce: Modelagem de Dados &amp; Invariantes em Centavos (TUDO COMEÇA AQUI!)
    </text>
    <text x="170" y="59" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">
      Quem existe no sistema? Lojista (Store), Produto (Product), Pedido (Order), Sub-pedido (SubOrder) e Item Congelado (OrderItem).
    </text>
    <text x="170" y="80" fill="#fde68a" font-family="monospace" font-size="12" font-weight="700">
      Arquivos: 02-alicerce-banco/models_esqueleto.py · Dinheiro SEMPRE em centavos inteiros (R$ 129,90 = 12990)
    </text>
  </g>
</svg>
